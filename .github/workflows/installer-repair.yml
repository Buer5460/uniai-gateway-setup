name: Installer repair verification
on:
  push:
    paths:
      - tools/repair_installer.py
      - tools/verify_install.ps1
      - install.ps1
      - .github/workflows/installer-repair.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download verified original and build repaired installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Invoke-WebRequest 'https://github.com/Buer5460/uniai-gateway-setup/releases/download/v0.8.0/UniAI-Setup-0.8.0-windows-x64.exe' -OutFile out/original.exe
          python tools/repair_installer.py out/original.exe out/UniAI-Setup-0.8.0-installer-fix.1-windows-x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Verify native GUI and isolated-profile one-command installation
        shell: powershell
        run: '& .\tools\verify_install.ps1'
      - name: Upload diagnostics and repaired installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uniai-installer-repair
          path: |
            out/UniAI-Setup-0.8.0-installer-fix.1-windows-x64.exe
            out/*.json
            out/*.log
          retention-days: 14
      - name: Publish separately named prerelease only after all checks pass
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.8.0-installer-fix.1 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host 'Release already exists; not overwriting verified assets.'; exit 0 }
          gh release create v0.8.0-installer-fix.1 --repo $env:GITHUB_REPOSITORY --prerelease --target $env:GITHUB_SHA --title 'UniAI 0.8.0 - installer entry repair 1' --notes 'Repairs the no-argument setup wizard. Core payload unchanged. Actual Windows Server 2022 fresh-runner test with isolated profile and no Python/Node/Git on PATH. This is NOT a claim of validation on every blank Windows 10/11 system. Unsigned: do not bypass Windows security policies. See verification.json.' out/UniAI-Setup-0.8.0-installer-fix.1-windows-x64.exe out/UniAI-Setup-0.8.0-installer-fix.1-windows-x64.json out/verification.json
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
