name: Installer entry fix and Windows verification
on:
  push:
    branches: [fix/installer-entry-20260923]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: installer-entry-fix
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download reviewed input and verify digest
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path build,evidence | Out-Null
          $url='https://github.com/Buer5460/uniai-gateway-setup/releases/download/v0.8.0/UniAI-Setup-0.8.0-windows-x64.exe'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile build/original.exe -TimeoutSec 180
          if ((Get-FileHash build/original.exe -Algorithm SHA256).Hash -ne 'b6dbaa1d5337cb1da065cbaa9c4747cc7959314013d770f99ea782b90c753c7a') { throw 'Input digest mismatch' }
      - name: Repair only installer entry and reproduce regression
        run: python tools/repair_installer.py build/original.exe build/UniAI-Setup-0.8.0-installer.1-windows-x64.exe
      - name: Install browser test harness (not an application dependency)
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Run EXE and PowerShell installation with isolated application environment
        run: python tools/verify_windows.py --installer build/UniAI-Setup-0.8.0-installer.1-windows-x64.exe --bootstrap install-fixed.ps1 --out evidence
      - name: Upload bounded test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installer-entry-evidence
          path: evidence/
          retention-days: 14
      - name: Upload verified installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installer-entry-fixed
          path: |
            build/UniAI-Setup-0.8.0-installer.1-windows-x64.exe
            build/UniAI-Setup-0.8.0-installer.1-windows-x64.build.json
            build/UniAI-Setup-0.8.0-installer.1-windows-x64.sha256
          retention-days: 14
  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: installer-entry-fixed
          path: release
      - name: Publish a new prerelease, never overwrite v0.8.0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -eu
          cat > notes.md <<'EOF'
          Installer-entry hotfix for the existing UniAI Gateway 0.8.0 payload.
          Repairs the no-argument GUI path that previously returned zero without opening the installer.
          Gateway payload is unchanged. The executable remains unsigned; do not bypass organizational security controls.
          Windows hosted-CI installation, isolated Unicode/space paths, application PATH without Python/Node, and actual browser rendering are verified by the linked workflow.
          This does NOT claim a clean physical Windows 10/11 machine, a different Windows account, or every security-policy environment was tested.
          EOF
          gh release create v0.8.0-installer.1 release/* --target "$COMMIT" --prerelease --title 'UniAI installer entry hotfix 1' --notes-file notes.md
