name: Public one-line installation
on:
  push:
    paths:
      - .github/workflows/published-install.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-install:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Public download, install, launch and rendered console
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:GITHUB_WORKSPACE 'public-evidence'
          New-Item -ItemType Directory -Force $out | Out-Null
          $root=Join-Path $env:RUNNER_TEMP ('UniAI-'+[char]0x5168+[char]0x65B0+' user')
          $env:USERPROFILE=Join-Path $root 'profile';$env:HOME=$env:USERPROFILE
          $env:LOCALAPPDATA=Join-Path $env:USERPROFILE 'AppData\Local'
          $env:APPDATA=Join-Path $env:USERPROFILE 'AppData\Roaming'
          $env:TEMP=Join-Path $root 'temp';$env:TMP=$env:TEMP
          foreach($d in @($env:LOCALAPPDATA,$env:APPDATA,$env:TEMP,(Join-Path $env:USERPROFILE 'Desktop'))) { New-Item -ItemType Directory -Force $d | Out-Null }
          Remove-Item Env:PYTHONHOME,Env:PYTHONPATH,Env:TCL_LIBRARY,Env:TK_LIBRARY -ErrorAction SilentlyContinue
          $env:PATH="$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          Set-Location $root
          $checks=[System.Collections.Generic.List[object]]::new()
          function Check($name,$ok) { $checks.Add(@{name=$name;passed=[bool]$ok});Write-Host ($name+': '+$ok);if(-not $ok){throw ('FAILED '+$name)} }
          function GetJson($url) {
            $r=[Net.HttpWebRequest]::Create($url);$r.Proxy=$null;$r.Timeout=5000
            $resp=$r.GetResponse();try{$reader=New-Object IO.StreamReader($resp.GetResponseStream());try{return ($reader.ReadToEnd() | ConvertFrom-Json)}finally{$reader.Dispose()}}finally{$resp.Dispose()}
          }
          function VisibleText($wsUrl) {
            $ws=New-Object Net.WebSockets.ClientWebSocket
            $cts=New-Object Threading.CancellationTokenSource
            $cts.CancelAfter(10000)
            try {
              $ws.ConnectAsync([Uri]$wsUrl,$cts.Token).GetAwaiter().GetResult()
              $request=@{id=1;method='Runtime.evaluate';params=@{expression='document.body.innerText';returnByValue=$true}} | ConvertTo-Json -Depth 6 -Compress
              $bytes=[Text.Encoding]::UTF8.GetBytes($request)
              $ws.SendAsync([ArraySegment[byte]]::new($bytes),[Net.WebSockets.WebSocketMessageType]::Text,$true,$cts.Token).GetAwaiter().GetResult()
              while($true) {
                $ms=New-Object IO.MemoryStream
                do {
                  $buffer=New-Object byte[] 65536
                  $received=$ws.ReceiveAsync([ArraySegment[byte]]::new($buffer),$cts.Token).GetAwaiter().GetResult()
                  $ms.Write($buffer,0,$received.Count)
                } while(-not $received.EndOfMessage)
                $message=[Text.Encoding]::UTF8.GetString($ms.ToArray()) | ConvertFrom-Json
                $ms.Dispose()
                if($message.id -eq 1) { return [string]$message.result.result.value }
              }
            } finally { $ws.Dispose();$cts.Dispose() }
          }
          $ok=$false
          try {
            Check 'no_python_node_git_commands' (-not(Get-Command python,node,git -ErrorAction SilentlyContinue))
            $edge=@("${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe","$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe") | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $edge){throw 'CI browser unavailable'}
            $browserProfile=Join-Path $env:RUNNER_TEMP ('uniai-browser-'+[Guid]::NewGuid().ToString('N'))
            # Only the test browser is replaced by headless Edge. The actual launcher delivers its own URL and nonce.
            $env:BROWSER='"'+$edge+'" --headless=new --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 --no-first-run --user-data-dir="'+$browserProfile+'" %s &'
            $ErrorActionPreference='Stop'; [Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12; & ([scriptblock]::Create((Invoke-WebRequest -UseBasicParsing -TimeoutSec 60 -Uri 'https://raw.githubusercontent.com/Buer5460/uniai-gateway-setup/49dcf97aa63865d86825a116aeb6d7d93d51203f/install.ps1').Content))
            $target=Join-Path $env:LOCALAPPDATA 'UniAI Gateway'
            Check 'public_command_created_installation' (Test-Path (Join-Path $target 'install.json'))
            $config=Get-Content (Join-Path $target 'install.json') -Raw -Encoding UTF8 | ConvertFrom-Json
            $base='http://127.0.0.1:'+$config.port
            Check 'gateway_identity_healthy' ((GetJson ($base+'/health')).service -eq 'uniai-gateway')
            $overview=[string][char]0x603B+[char]0x89C8
            $scan=[string][char]0x626B+[char]0x63CF+[char]0x672C+[char]0x673A
            $text='';$ready=$false
            for($i=0;$i -lt 40;$i++) {
              try {
                $tab=@(GetJson 'http://127.0.0.1:9222/json') | Where-Object {$_.type -eq 'page' -and $_.url -like ($base+'/console*')} | Select-Object -First 1
                if($tab) { $text=VisibleText $tab.webSocketDebuggerUrl; $ready=$text.Contains($overview) -and $text.Contains($scan) }
              } catch {}
              if($ready){break};Start-Sleep -Seconds 2
            }
            # No raw HTML, URLs, session keys or browser state are exported.
            $safe=[regex]::Replace($text,'(?i)(?:gw_|sk-|vk_|eyJ)[A-Za-z0-9_.-]{10,}','[REDACTED]')
            @{visible_text=$safe.Substring(0,[Math]::Min(2000,$safe.Length));rendered=$ready} | ConvertTo-Json | Set-Content (Join-Path $out 'render-summary.json') -Encoding UTF8
            Check 'real_launcher_browser_renders_overview_and_scan' $ready
            $ok=$true
          } finally {
            @{success=$ok;checks=$checks;os=[Environment]::OSVersion.VersionString;test_type='fresh hosted Windows VM; isolated Unicode profile; restricted PATH; actual public command; real launcher URL in headless Edge';windows_10_11_blank_physical_machine_tested=$false;model_accounts_present=$false;bootstrap_commit='49dcf97aa63865d86825a116aeb6d7d93d51203f';installer_sha256='e0ede3350235312db4c090b0aa731528ca963633e124cef2ebd861e2e52693d3';repeated_browser_login_tested=$false} | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $out 'public-install-result.json') -Encoding UTF8
            $logs=Join-Path $env:LOCALAPPDATA 'UniAI Installer\logs'
            if(Test-Path $logs){Get-ChildItem $logs -Filter '*.log' | ForEach-Object {Copy-Item $_.FullName $out;Get-Content $_.FullName -Tail 10 -Encoding UTF8 | Write-Host}}
            if(Test-Path (Join-Path $out 'render-summary.json')){Get-Content (Join-Path $out 'render-summary.json') -Raw -Encoding UTF8 | Write-Host}
          }
      - name: Retain sanitized verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-one-line-installation
          path: public-evidence/
          retention-days: 14
